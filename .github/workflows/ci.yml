name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check portable public configuration
        run: bin/check-public-config
      - name: Scan committed source for secrets
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          mkdir /tmp/feeds-public-source
          git archive HEAD | tar -x -C /tmp/feeds-public-source
          /tmp/gitleaks dir --no-banner --redact --config .gitleaks.toml /tmp/feeds-public-source

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-1.96.0-${{ hashFiles('rust/Cargo.lock') }}
      - name: Formatting, strict lint and compatibility tests
        run: bin/ci

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: telesink
          POSTGRES_DB: telesink_rust_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55438:5432
        options: --health-cmd="pg_isready -U telesink" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: PostgreSQL migration and legacy queue verification
        env:
          TELESINK_TEST_DATABASE_URL: postgresql://telesink@127.0.0.1:55438/telesink_rust_test
          RUST_TEST_THREADS: 2
        run: cargo test --manifest-path rust/Cargo.toml --locked --features postgres-import --jobs 2 --test import_postgres --test queue

  container:
    needs: [public-config, native, migration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the native runtime
        run: docker build --tag feeds-ci .
      - name: Verify installation, persistent storage, and owner recovery
        run: bin/test-container feeds-ci
