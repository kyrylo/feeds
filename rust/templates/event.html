{% if detail_frame %}<turbo-frame id="detail_event_{{ event.id }}">{% include 'event-detail.html' %}</turbo-frame>
{% else %}<section class="event-permalink"><header class="event-feed__header"><h1 class="event-feed__title">{% if sink.folder_name %}<span class="event-feed__folder">{{ sink.folder_name }}</span><span class="event-feed__separator">/</span>{% endif %}<a href="/sinks/{{ sink.id }}" class="event-feed__channel link">#{{ sink.name }}</a></h1><span class="event-permalink__id">#{{ event.id }}</span></header><div class="event-row event-row--static">{% include 'event-row-content.html' %}</div>{% include 'event-detail.html' %}</section>{% endif %}
