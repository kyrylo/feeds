    {% for filter in type_filters %}<li class="event-filters__item{% if filter.current %} event-filters__item--current{% endif %}"><a href="{{ filter.url }}" class="event-filters__link{% if not filter.all %} event-type-color{% endif %}{% if filter.current %} event-filters__link--current{% endif %}" style="{{ filter.color }}" title="{% if filter.all %}all events{% else %}{{ filter.label }}{% endif %}"{% if filter.current %} aria-current="page"{% endif %} data-turbo-frame="main_content" data-turbo-action="advance">
      <span class="event-filters__icon">{% if filter.all %}{% set icon='all' %}{% include 'icons.html' %}{% else %}{{ filter.icon }}{% endif %}</span><span class="event-filters__label">{{ filter.label }}</span><span id="event_type_count_{{ variant }}_{{ filter.key }}" class="event-filters__count">{{ filter.count }}</span>
    </a></li>{% endfor %}
