<turbo-frame id="column_{{ column.id }}"><div class="column__header"><h2 class="column__title">edit column "{{ column.name }}"</h2><a href="/sinks/{{ column.sink_id }}/columns/{{ column.id }}" data-turbo-frame="column_{{ column.id }}" data-turbo-prefetch="false" class="link link--subtle" title="close">{% set icon='clear' %}{% include 'icons.html' %}</a></div>
<div class="column-data"><form action="/sinks/{{ column.sink_id }}/columns/{{ column.id }}" method="post" class="form"><input type="hidden" name="authenticity_token" value="{{ csrf }}"><input type="hidden" name="_method" value="patch">
<div class="form-field"><label for="column_{{ column.id }}_name" class="form-field__label">name</label><input type="text" name="column[name]" id="column_{{ column.id }}_name" value="{{ column.name }}" autofocus class="text-field"></div>
<div class="form-field"><label for="column_{{ column.id }}_event_types" class="form-field__label">filter by event</label><input type="hidden" name="column[event_types][]" value=""><select multiple size="8" name="column[event_types][]" id="column_{{ column.id }}_event_types" class="text-field"><option value="">(show all events)</option>{% for kind in available_types %}<option value="{{ kind.value }}"{% if kind.selected %} selected{% endif %}>{{ kind.label }}</option>{% endfor %}</select><small class="form-field__help">hold ctrl/cmd to select multiple events</small></div>
<div class="form-field"><label for="column_{{ column.id }}_search" class="form-field__label">filter by text</label><input type="search" name="column[search]" id="column_{{ column.id }}_search" value="{{ column_search }}" class="text-field"><small class="form-field__help">case-insensitive, can be empty</small></div>
{% if alert %}<div class="banner banner--danger">{{ alert }}</div>{% endif %}{% if notice %}<div class="banner banner--success">{{ notice }}</div>{% endif %}
<div><button type="submit" class="btn btn--primary">save column</button></div></form><hr class="divider"><details><summary class="link">more</summary><form action="/sinks/{{ column.sink_id }}/columns/{{ column.id }}" method="post" data-turbo-frame="_top" data-turbo-confirm="delete the '{{ column.name }}' column? events in this column will not be deleted."><input type="hidden" name="authenticity_token" value="{{ csrf }}"><input type="hidden" name="_method" value="delete"><button type="submit" class="btn btn--danger">delete column</button></form></details></div></turbo-frame>
