<div class="detail-heading"><span class="event-color-{{ event.event_color }}">{{ event.event_type }}</span><a href="/events/{{ event.id }}">Permalink ↗</a></div>
{% if properties %}<dl class="properties">{% for property in properties %}<dt>{{ property.key }}</dt><dd>{{ property.value }}</dd>{% endfor %}</dl>{% endif %}
<div class="event-timestamp"><time datetime="{{ event.occurred_at }}" data-absolute>{{ event.occurred_at }}</time></div>
