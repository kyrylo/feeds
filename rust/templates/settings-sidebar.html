<aside class="column sidebar">
  <div class="sidebar__content">
    <div class="column__header">
      <h1 class="column__title">settings</h1>
      <a href="/" class="link link--subtle" title="back"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="icon"><path fill-rule="evenodd" d="M12.5 9.75A2.75 2.75 0 0 0 9.75 7H4.56l2.22 2.22a.75.75 0 1 1-1.06 1.06l-3.5-3.5a.75.75 0 0 1 0-1.06l3.5-3.5a.75.75 0 0 1 1.06 1.06L4.56 5.5h5.19a4.25 4.25 0 0 1 0 8.5h-1a.75.75 0 0 1 0-1.5h1a2.75 2.75 0 0 0 2.75-2.75Z" clip-rule="evenodd"/></svg></a>
    </div>
    <nav>
      <h2 class="sidebar__section-title">personal</h2>
      <ul class="list sidebar-list">
        {% for item in ['nickname','email','password'] %}<li class="sidebar-list__item{% if mode == item %} sidebar-list__item--current{% endif %}">{% if mode == item %}{{ item }}{% else %}<a href="/settings/{{ item }}/edit" class="link">{{ item }}</a>{% endif %}</li>{% endfor %}
      </ul>
    </nav>
  </div>
  {% include 'account.html' %}
</aside>
