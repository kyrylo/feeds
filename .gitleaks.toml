title = "Feeds secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Fixed synthetic Rails compatibility signing key"
condition = "AND"
paths = ['''(?:^|/)bin/rails-reference$''', '''(?:^|/)rust/reference/container_check\.py$''']
regexTarget = "secret"
regexes = ['''^0123456789abcdef(?:0123456789abcdef){0,3}$''']

[[allowlists]]
description = "Exact signed compatibility fixtures generated with the fixed test key"
condition = "AND"
paths = ['''(?:^|/)rust/tests/fixtures/live-contracts\.json$''']
regexTarget = "secret"
regexes = [
  '''^InVzZXJfMTIzX3NpbmtzIg==\-\-a77c105f980ee8ffbd6d6fd6999cb195a380c19e24e421a98fbcbdcd711b0eb8$''',
